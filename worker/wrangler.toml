name = "sweep-payment"
main = "worker/payment-worker.js"
compatibility_date = "2024-09-23"

kv_namespaces = [
  { binding = "CREDITS", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" },
  { binding = "PENDING_PAYMENTS", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID_2" }
]

# Optional: enable for cron triggers (expire stale pending payments)
# [triggers]
# crons = ["0 * * * *"]