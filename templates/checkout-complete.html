<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Complete — Sweep</title>
    <link rel="stylesheet" href="marketing.css">
    <style>
        .status { max-width: 560px; margin: 100px auto; text-align: center; padding: 48px 32px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
        .status-icon { font-size: 48px; margin-bottom: 16px; }
        .status h1 { font-size: 24px; margin-bottom: 12px; }
        .status p { color: var(--muted); margin-bottom: 24px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="wrap"><a href="/" class="logo">⟠ Sweep</a></div>
    </nav>

    <main class="wrap">
        <div class="status" id="status-processing">
            <div class="status-icon">⏳</div>
            <h1>Verifying your payment...</h1>
            <p>Please wait while we confirm your order.</p>
        </div>

        <div class="status hidden" id="status-success">
            <div class="status-icon">✓</div>
            <h1>Payment confirmed</h1>
            <p id="success-message">Your sweep credit is ready.</p>
            <a href="/app.html" class="btn btn-primary btn-lg" style="margin-top: 24px;">Start sweeping →</a>
        </div>

        <div class="status hidden" id="status-error">
            <div class="status-icon" style="color: #da3633;">✗</div>
            <h1>Verification failed</h1>
            <p id="error-message">We couldn't verify your payment.</p>
            <p style="font-size: 13px;">
                If you were charged, email
                <a href="mailto:support@yourdomain.com">support@yourdomain.com</a>
                with your order ID.
            </p>
        </div>
    </main>

    <script>
        const WORKER_URL = 'https://sweep-payment.yourname.workers.dev';
        const CLIENT_ID_KEY = 'sweep_client_id';

        (async function () {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('orderId');

            if (!orderId) {
                return showError('No order ID provided.');
            }

            const clientId = localStorage.getItem(CLIENT_ID_KEY);
            if (!clientId) {
                return showError('No client ID found. Try opening the app first, then returning to this page.');
            }

            try {
                const resp = await fetch(`${WORKER_URL}/square/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId, clientId }),
                });
                const data = await resp.json();

                if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);

                showSuccess(data.creditsAdded || 1, data.newBalance || 0);
                window.history.replaceState({}, '', window.location.pathname);
            } catch (err) {
                showError(err.message);
            }
        })();

        function showSuccess(creditsAdded, newBalance) {
            document.getElementById('status-processing').classList.add('hidden');
            document.getElementById('status-success').classList.remove('hidden');
            document.getElementById('success-message').textContent =
                `${creditsAdded} credit${creditsAdded > 1 ? 's' : ''} added. ` +
                `You now have ${newBalance} credit${newBalance > 1 ? 's' : ''}.`;
        }

        function showError(message) {
            document.getElementById('status-processing').classList.add('hidden');
            document.getElementById('status-error').classList.remove('hidden');
            document.getElementById('error-message').textContent = message;
        }
    </script>
</body>
</html>
